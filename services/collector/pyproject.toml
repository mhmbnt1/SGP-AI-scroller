[project]
name = "focusfeed-collector"
version = "0.1.0"
description = "FocusFeed local collector: runs on the user's own machine, drives a dedicated browser profile, polls the API for scoped jobs."
requires-python = ">=3.12,<3.14"
dependencies = [
    "ff-protocol",
    "pydantic>=2.10,<3",
    "httpx>=0.28",
    "playwright>=1.49",
    "keyring>=25.5",
    "typer>=0.15",
]

[project.scripts]
focusfeed-collector = "focusfeed_collector.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["focusfeed_collector"]

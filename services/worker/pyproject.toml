[project]
name = "focusfeed-worker"
version = "0.1.0"
description = "FocusFeed background worker: job orchestration, scheduling, enrichment, ranking, retention cleanup."
requires-python = ">=3.12,<3.14"
dependencies = [
    "focusfeed-api",
    "focusfeed-collector",
    "ff-protocol",
]

[project.scripts]
focusfeed-worker = "focusfeed_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["focusfeed_worker"]

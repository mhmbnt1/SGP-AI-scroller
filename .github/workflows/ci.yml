name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, types, tests (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: focusfeed_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      FF_MODE: test
      FF_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/focusfeed_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/focusfeed_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381e4a2ddb4ee5b8f3d # v4.3.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with: { version: "0.11.32", enable-cache: true }
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy services/api/focusfeed_api services/worker/focusfeed_worker services/collector/focusfeed_collector packages/protocol/ff_protocol
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q --junitxml=reports/pytest.xml --cov=focusfeed_api --cov=focusfeed_worker --cov=focusfeed_collector --cov=ff_protocol --cov-report=xml:reports/coverage.xml
      - run: uv run focusfeed-api evaluate --out reports/evaluation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: python-reports, path: reports/ }

  web:
    name: Web + contracts + mobile (lint, types, unit tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381e4a2ddb4ee5b8f3d # v4.3.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @focusfeed/contracts typecheck
      - run: pnpm --filter @focusfeed/web lint
      - run: pnpm --filter @focusfeed/web typecheck
      - run: pnpm --filter @focusfeed/web test
      - run: pnpm --filter @focusfeed/web build
      - run: pnpm --filter @focusfeed/mobile typecheck
      - run: pnpm --filter @focusfeed/mobile test

  contract-drift:
    name: OpenAPI contract is up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env: { FF_MODE: test, FF_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789 }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381e4a2ddb4ee5b8f3d # v4.3.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with: { version: "0.11.32" }
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: uv sync --all-packages --frozen
      - run: pnpm install --frozen-lockfile --filter @focusfeed/contracts
      - run: uv run focusfeed-api export-openapi && pnpm --filter @focusfeed/contracts generate
      - run: git diff --exit-code -- packages/contracts/openapi.json packages/contracts/src/schema.d.ts

  security:
    name: Secret and dependency scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381e4a2ddb4ee5b8f3d # v4.3.1
        with: { fetch-depth: 0 }
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env: { GITHUB_TOKEN: "${{ github.token }}" }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with: { version: "0.11.32" }
      - run: uv sync --all-packages --frozen
      - name: pip-audit (Python dependencies)
        run: uv run --with pip-audit pip-audit --strict --progress-spinner off -r <(uv export --all-packages --no-dev --no-hashes --format requirements-txt) || true
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (JS dependencies, high+)
        run: pnpm audit --audit-level high || true
      - run: uv run bandit -q -r services/api/focusfeed_api services/worker/focusfeed_worker services/collector/focusfeed_collector -x tests || true

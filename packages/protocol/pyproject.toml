[project]
name = "ff-protocol"
version = "0.1.0"
description = "FocusFeed shared protocol DTOs: collector <-> API job instructions, candidate/evidence contracts, result states."
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.10,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ff_protocol"]
